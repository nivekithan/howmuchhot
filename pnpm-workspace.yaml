packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer
allowBuilds:
  esbuild: true
  workerd: true

catalog:
  "@types/node": ^24
  hono: ^4.13.13
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20261018.1"
